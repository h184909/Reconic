spring.application.name=Reconic
server.port=8080
spring.thymeleaf.cache=false

# v0.5.2.1 public/passive intelligence.
# MTA-STS, TLS-RPT and autodiscover use ordinary passive DNS lookups.
#
# DNSSEC DS lookup uses Google Public DNS DNS-over-HTTPS because the JDK/JNDI
# resolver used for the other lookups does not reliably support RR type DS.
reconic.public-intelligence.dnssec-doh.enabled=true

# Certificate Transparency remains opt-in because crt.sh is an external
# community service that can be slow or rate limited.
reconic.public-intelligence.ct.enabled=false

# Shared domains are cached per search, so the same domain is only enriched once.
reconic.public-intelligence.max-concurrency=16

# Norid is intentionally NOT used by Reconic lead enrichment.
# The public lookup terms prohibit commercial use of lookup data, so it is not
# an appropriate source for this sales/lead-intelligence workflow.
