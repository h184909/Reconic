spring.application.name=Reconic
server.port=8080
spring.thymeleaf.cache=false

# v0.5.2 public/passive intelligence.
# DNS-based MTA-STS, TLS-RPT, DNSSEC and autodiscover lookups are always enabled.
#
# Norid RDAP is designed for automated lookups, but public access can be rate limited.
# Keep disabled while validating locally; enable deliberately when you want to test it.
reconic.public-intelligence.norid.enabled=false

# crt.sh is an external Certificate Transparency service and can be slow/rate limited.
# It is therefore opt-in rather than queried for every lead by default.
reconic.public-intelligence.ct.enabled=false

reconic.public-intelligence.max-concurrency=16
